name: rAJIT build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test-avm1:
    name: AVM1 regression tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/linux-dependencies.txt)

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rajit-test

      - name: Build tests
        run: cargo test -p tests --test tests --profile ci --no-run

      # Shared string code (hashing / case-insensitive equality) was touched, so run everything.
      - name: Full regression suite
        run: |
          set +e
          cargo test -p tests --test tests --profile ci 2>&1 | tee /tmp/full.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            names=$(grep -E '^test .* FAILED$' /tmp/full.log | head -60 | awk '{printf "%s%%0A", $0}')
            echo "::error title=failing tests::${names}"
            details=$(grep -E -A6 '^---- .* stdout ----' /tmp/full.log | head -80 | cut -c1-240 | awk '{printf "%s%%0A", $0}')
            echo "::error title=failure details::${details}"
          fi
          exit $status

      - name: AVM1 tests, default thresholds
        run: cargo test -p tests --test tests --profile ci -- avm1

      # Compile every block on its first execution so the whole suite
      # exercises the compiled tier instead of the interpreter.
      - name: AVM1 tests, compile everything (RAJIT_THRESHOLD=1)
        env:
          RAJIT_THRESHOLD: "1"
        run: cargo test -p tests --test tests --profile ci -- avm1

  bench:
    name: Benchmarks and profile (Linux, release-like)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/linux-dependencies.txt)
          sudo apt-get install -y linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rajit-bench

      - name: Build tests (rajit profile)
        run: cargo test -p tests --test tests --profile rajit --no-run

      # interpreter (RAJIT_DISABLE=1) vs compiled tier; results appear as annotations
      - name: Benchmarks
        run: bash .github/scripts/bench.sh rajit

      - name: Profile
        run: bash .github/scripts/profile.sh rajit

  build-windows:
    name: Build rajit.exe (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rajit-windows

      - name: Build desktop player
        run: cargo build --locked --package ruffle_desktop --release

      - name: Package
        shell: bash
        run: |
          mkdir package
          cp target/release/ruffle_desktop.exe package/rajit.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rajit-windows-x86_64
          path: package/rajit.exe
          if-no-files-found: error
