name: rAJIT stress (flakiness check)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  stress:
    name: Repeat suite ${{ matrix.mode }} @ ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: interpreter, ref: main }
          - { mode: interpreter, ref: exp-no-wstr }
          - { mode: forced-compile, ref: exp-no-wstr }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/linux-dependencies.txt)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rajit-stress-${{ matrix.ref }}
      - name: Build tests
        run: cargo test -p tests --test tests --profile ci --no-run
      - name: Run the suite 8 times
        shell: bash {0}   # no -e: a failing run must not abort the loop
        run: |
          case "${{ matrix.mode }}" in
            interpreter)    export RAJIT_DISABLE=1 ;;
            forced-compile) export RAJIT_THRESHOLD=1 ;;
          esac
          for i in 1 2 3 4 5 6 7 8; do
            cargo test -p tests --test tests --profile ci > /tmp/run$i.log 2>&1
            failed=$(grep -E '^test .* FAILED$' /tmp/run$i.log | awk '{print $2}' | tr '\n' ' ')
            result=$(grep -E '^test result' /tmp/run$i.log | head -1 | cut -c1-80)
            echo "::notice title=${{ matrix.ref }} ${{ matrix.mode }} run $i::${result} FAILED: ${failed:-none}"
            if [ -n "$failed" ] && [ -z "$shown" ]; then
              shown=1
              sec=$(sed -n '/^failures:/,$p' /tmp/run$i.log | head -40 | cut -c1-300 | awk '{printf "%s%%0A", $0}')
              echo "::warning title=${{ matrix.ref }} failure detail::${sec}"
            fi
          done
          exit 0
